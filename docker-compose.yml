services:
  docintel:
    build: .
    image: docintel:latest
    container_name: docintel
    ports:
      - "8501:8501"
    environment:
      # Read from the local .env file (git-ignored, never committed).
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      # Keep the history DB inside the persisted volume.
      DOCINTEL_DB: /app/data/docintel_history.db
    volumes:
      - docintel_history:/app/data
    restart: unless-stopped

volumes:
  docintel_history:
